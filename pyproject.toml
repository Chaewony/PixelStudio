[project]
name = "pixelstudio"
version = "0.1.0"
description = "Discord와 LangChain 모델, Aseprite MCP를 연결하는 픽셀아트 제작 봇"
readme = "README.md"
authors = [
    { name = "Chaewony", email = "tcd1205@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "jsonschema>=4.26.0",
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1.2.20,<2",
    "mcp>=2,<3",
    "pillow>=13.0.0",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
pixelstudio = "pixelstudio.cli:main"

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1,<2",
]
google = [
    "langchain-google-genai>=4,<5",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
